<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://atlasdigital.ia.br/privacidade" />
    <title>Política de Privacidade | Atlas Digital</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #121212;
        color: #e4e0d7;
      }
      body {
        margin: 0;
        line-height: 1.65;
      }
      .container {
        box-sizing: border-box;
        max-width: 52rem;
        margin-inline: auto;
        padding-inline: clamp(1.25rem, 5vw, 3rem);
      }
      header {
        border-bottom: 1px solid #38342b;
      }
      header .container {
        padding-block: 1rem;
      }
      .brand {
        display: inline-flex;
      }
      .brand img {
        display: block;
        width: 9.5rem;
        height: auto;
      }
      main {
        padding-block: clamp(2.5rem, 8vw, 5rem);
      }
      h1, h2 {
        color: #fffaf0;
        line-height: 1.2;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 6vw, 3.25rem);
      }
      h2 {
        margin: 2.25rem 0 0.75rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1rem;
      }
      .subtitle, a {
        color: #efcf91;
      }
      .subtitle {
        margin-bottom: 2rem;
      }
      a {
        overflow-wrap: anywhere;
      }
      a:focus-visible {
        outline: 2px solid #efcf91;
        outline-offset: 4px;
      }
      footer {
        margin-top: 3rem;
        border-top: 1px solid #38342b;
        padding-top: 1.5rem;
        color: #c1bbaf;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <a class="brand" href="/">
          <img src="/src/home/assets/logo-atlas-site.png" alt="Atlas Digital — página inicial" />
        </a>
      </div>
    </header>
    <main class="container">
      <!-- ATLAS_PRIVACY_POLICY -->
      <footer>
        <p>Atlas Digital · CNPJ 66.204.635/0001-19 · Porto Alegre, RS</p>
        <a href="mailto:contato@atlasdigital.ia.br">contato@atlasdigital.ia.br</a>
      </footer>
    </main>
  </body>
</html>
